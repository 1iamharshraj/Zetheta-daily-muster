# Calls the muster's reminders endpoint every 15 minutes during the working day.
# Vercel Hobby only allows a daily cron, so GitHub Actions does the scheduling instead.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://zetheta-daily-muster.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: Reminders
on:
  schedule:
    - cron: '*/15 3-15 * * 1-6'   # 08:30–21:00 IST, Mon–Sat (GitHub cron is UTC)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set APP_URL and CRON_SECRET secrets"; exit 1; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/reminders"
